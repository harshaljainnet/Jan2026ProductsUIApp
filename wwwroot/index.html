<!DOCTYPE html>
<html>
<head>
    <title>Product Portal - Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0078d4, #00b4ff);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            width: 350px;
            text-align: center;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.2);
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        .login-btn {
            background: #0078d4;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
        }

            .login-btn:hover {
                background: #005fa3;
            }

        .logo {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }
    </style>

</head>

<body>

    <div class="login-container">

        <div class="logo">🔐</div>

        <h2>Product Portal</h2>

        <p>Please sign in using your Microsoft account</p>

        <button class="login-btn" onclick="login()">
            Sign in with Microsoft
        </button>

        <div class="footer">
            Secure login using Azure AD
        </div>

    </div>

    <script src="https://alcdn.msauth.net/browser/2.37.0/js/msal-browser.min.js"></script>
    <script src="auth.js"></script>

</body>
</html>
